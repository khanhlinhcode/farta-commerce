[project]
name = "farta-ai-service"
version = "0.1.0"
description = "AI-ready boundary for FARTA; no direct commerce data access"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "google-genai==2.31.0",
  "groq==1.7.0",
  "pydantic-ai-slim[google,groq]==2.57.0",
  "pydantic-settings==2.16.0",
  "redis==8.1.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
